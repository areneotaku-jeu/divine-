<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonne nuit, Divine 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#0a0820;
    --plum:#2b1141;
    --rose:#ff8fb1;
    --blush:#ffd3df;
    --gold:#f3d9a4;
    --moon:#fff6ea;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--midnight);overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    color:var(--moon);
  }

  /* ---------- Scène (ciel) ---------- */
  #world{
    position:fixed;inset:0;
    background:
      radial-gradient(120% 90% at 20% 0%, #3a1650 0%, transparent 60%),
      radial-gradient(100% 80% at 90% 100%, #4a1242 0%, transparent 55%),
      linear-gradient(180deg,#0a0820 0%,#1a0e38 55%,#2b1141 100%);
  }
  #camera{
    position:absolute;inset:0;
    transform-origin:50% 55%;
    animation:push 90s linear forwards;
  }
  @keyframes push{from{transform:scale(1)}to{transform:scale(1.14)}}
  #sky{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- Effet pellicule ---------- */
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(5,3,15,.75) 100%);
  }
  #grain{
    position:fixed;inset:-50%;pointer-events:none;opacity:.09;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .9s steps(6) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}
    20%{transform:translate(-4%,3%)}
    40%{transform:translate(3%,-5%)}
    60%{transform:translate(-6%,-2%)}
    80%{transform:translate(5%,4%)}
    100%{transform:translate(0,0)}
  }
  .bar{
    position:fixed;left:0;right:0;height:0;background:#000;z-index:5;
    transition:height 2.4s cubic-bezier(.6,.05,.2,1);
  }
  .bar.top{top:0}.bar.bottom{bottom:0}
  body.playing .bar{height:min(9vh,70px)}

  /* ---------- Texte ---------- */
  #stage{
    position:fixed;inset:0;z-index:3;
    display:flex;align-items:center;justify-content:center;
    padding:12vh 7vw;text-align:center;pointer-events:none;
  }
  .line{
    position:absolute;max-width:min(92vw,900px);
    transition:opacity 1.6s ease, filter 1.6s ease, transform 2.4s ease;
  }
  .line.out{opacity:0;filter:blur(10px);transform:translateY(-18px) scale(1.03)}
  .w{
    display:inline-block;margin:0 .14em;
    opacity:0;filter:blur(14px);transform:translateY(18px) scale(.96);
    animation:wordIn 1.8s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes wordIn{to{opacity:1;filter:blur(0);transform:none}}

  .soft{
    font-style:italic;font-weight:300;
    font-size:clamp(1.7rem,6.2vw,3.1rem);line-height:1.35;
    color:var(--blush);
    text-shadow:0 0 24px rgba(255,143,177,.55),0 0 60px rgba(255,143,177,.25);
  }
  .script{
    font-family:'Great Vibes','Snell Roundhand','Apple Chancery','Brush Script MT',cursive;
    font-size:clamp(3.6rem,17vw,9rem);line-height:1.05;
    color:#fff;
    text-shadow:0 0 18px rgba(255,143,177,.9),0 0 50px rgba(255,92,138,.7),0 0 110px rgba(255,92,138,.45);
  }
  .script.sm{font-size:clamp(3rem,13vw,7rem)}
  .name{
    font-weight:500;letter-spacing:.22em;
    font-size:clamp(2.6rem,13vw,7.4rem);line-height:1.1;
    padding-left:.22em;
  }
  .name .w{
    margin:0;
    background:linear-gradient(180deg,#fff9e8 10%,var(--gold) 55%,#d99a6c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(243,217,164,.55));
  }
  .name .w{animation-name:nameIn}
  @keyframes nameIn{
    from{opacity:0;transform:translateY(24px) scale(.9);letter-spacing:.6em}
    to{opacity:1;transform:none}
  }
  .name.pulse{animation:glowPulse 4s ease-in-out infinite}
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 10px rgba(255,143,177,.4))}
    50%{filter:drop-shadow(0 0 34px rgba(255,143,177,.9))}
  }
  .final-heart{
    display:block;font-size:clamp(2rem,8vw,3.4rem);margin-top:.35em;
    animation:beat 1.6s ease-in-out infinite;
    text-shadow:0 0 24px rgba(255,92,138,.9);
  }
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}

  /* ---------- Écran de départ + boutons ---------- */
  #intro{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;
    background:radial-gradient(circle at 50% 45%, rgba(43,17,65,.92), rgba(10,8,32,.98));
    transition:opacity 2s ease, visibility 2s;
    padding:2rem;text-align:center;
  }
  #intro.gone{opacity:0;visibility:hidden;pointer-events:none}
  #intro p{
    font-style:italic;font-weight:300;font-size:clamp(1.2rem,4.5vw,1.7rem);
    color:var(--blush);max-width:20em;line-height:1.5;
  }
  #start{
    all:unset;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    width:112px;height:112px;border-radius:50%;
    font-size:3rem;
    background:radial-gradient(circle at 35% 30%, #ff9db9, #e0406f 70%);
    box-shadow:0 0 0 0 rgba(255,92,138,.6),0 0 50px rgba(255,92,138,.6);
    animation:ring 2.2s ease-out infinite, beat 1.6s ease-in-out infinite;
  }
  #start:focus-visible,.ctl:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
  @keyframes ring{to{box-shadow:0 0 0 38px rgba(255,92,138,0),0 0 50px rgba(255,92,138,.6)}}
  #intro small{font-size:1rem;color:rgba(255,246,234,.6);font-style:italic}

  .ctl{
    all:unset;cursor:pointer;position:fixed;z-index:10;
    color:var(--blush);font-size:1.05rem;font-style:italic;
    padding:.55rem 1.1rem;border-radius:999px;
    border:1px solid rgba(255,211,223,.35);
    background:rgba(10,8,32,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity 1.2s ease, background .3s;
  }
  .ctl:hover{background:rgba(255,143,177,.25)}
  #mute{top:calc(min(9vh,70px) + 12px);right:14px;opacity:0;pointer-events:none}
  body.playing #mute{opacity:1;pointer-events:auto}
  #replay{
    left:50%;bottom:calc(min(9vh,70px) + 22px);transform:translateX(-50%);
    opacity:0;pointer-events:none;
  }
  #replay.show{opacity:1;pointer-events:auto}

  @media (prefers-reduced-motion: reduce){
    #camera{animation:none}
    #grain{animation:none}
  }
</style>
</head>
<body>

<div id="world">
  <div id="camera"><canvas id="sky" aria-hidden="true"></canvas></div>
</div>
<div id="vignette"></div>
<div id="grain"></div>
<div class="bar top"></div>
<div class="bar bottom"></div>

<main id="stage" aria-live="polite"></main>

<button class="ctl" id="mute" aria-label="Couper ou remettre la musique">♪ musique</button>
<button class="ctl" id="replay">revoir 💗</button>

<div id="intro">
  <p>Mets le son, mon amour.<br>J'ai préparé quelque chose rien que pour toi.</p>
  <button id="start" aria-label="Lancer">💗</button>
  <small>touche le cœur</small>
</div>

<script>
(() => {
  /* =====================================================
     CIEL : étoiles, lune, poussière d'or, cœurs, étoiles filantes
     ===================================================== */
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;
  let stars = [], dust = [], hearts = [], shooters = [];
  let intensity = 1;               // fréquence des cœurs
  const COLORS = ['#ff8fb1', '#ff5c8a', '#ffc2d4', '#f3d9a4', '#ffb3c8'];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(Math.min(260, W * H / 5200));
    stars = Array.from({length: n}, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.92,
      r: Math.random() * 1.3 + .25,
      p: Math.random() * 6.28, s: Math.random() * 1.6 + .5
    }));
    dust = Array.from({length: reduce ? 20 : 55}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.8 + .6,
      vx: (Math.random() - .5) * 6, vy: -(Math.random() * 10 + 3),
      p: Math.random() * 6.28
    }));
  }
  addEventListener('resize', resize); resize();

  function heartPath(c, x, y, s){
    c.beginPath();
    c.moveTo(x, y + s*.3);
    c.bezierCurveTo(x, y - s*.2, x - s, y - s*.2, x - s, y + s*.35);
    c.bezierCurveTo(x - s, y + s*.8, x, y + s, x, y + s*1.25);
    c.bezierCurveTo(x, y + s, x + s, y + s*.8, x + s, y + s*.35);
    c.bezierCurveTo(x + s, y - s*.2, x, y - s*.2, x, y + s*.3);
    c.closePath();
  }

  function spawnHeart(x, y){
    hearts.push({
      x: x ?? Math.random() * W,
      y: y ?? H + 30,
      s: Math.random() * 11 + 6,
      vy: -(Math.random() * 38 + 26),
      vx: (Math.random() - .5) * 10,
      sway: Math.random() * 22 + 8,
      ph: Math.random() * 6.28,
      a: Math.random() * .45 + .45,
      c: COLORS[(Math.random() * COLORS.length) | 0]
    });
  }
  function burst(n){
    if (reduce) n = Math.round(n / 3);
    for (let i = 0; i < n; i++){
      setTimeout(() => spawnHeart(W * (.15 + Math.random() * .7), H * (.55 + Math.random() * .5)), i * 55);
    }
  }
  function shoot(){
    shooters.push({
      x: Math.random() * W * .8 + W * .15, y: Math.random() * H * .35,
      vx: -(Math.random() * 300 + 380), vy: Math.random() * 120 + 160,
      life: 0, max: .9 + Math.random() * .4
    });
  }

  function drawMoon(t){
    const mx = W * (W < 600 ? .78 : .84), my = H * .2, mr = Math.min(W, H) * (W < 600 ? .085 : .075);
    const pulse = 1 + Math.sin(t * .0007) * .06;
    let g = ctx.createRadialGradient(mx, my, mr * .6, mx, my, mr * 7 * pulse);
    g.addColorStop(0, 'rgba(255,232,214,.38)');
    g.addColorStop(.35, 'rgba(255,170,200,.14)');
    g.addColorStop(1, 'rgba(255,170,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createRadialGradient(mx - mr * .3, my - mr * .3, mr * .1, mx, my, mr);
    g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f7d9c4');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(200,150,150,.12)';
    [[-.3,.1,.22],[.25,-.25,.14],[.2,.35,.18],[-.1,-.4,.09]].forEach(([dx,dy,k]) => {
      ctx.beginPath(); ctx.arc(mx + dx*mr, my + dy*mr, k*mr, 0, 6.283); ctx.fill();
    });
  }

  let last = performance.now(), nextShoot = 3500, hearthAcc = 0;
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, W, H);

    // étoiles
    for (const s of stars){
      const a = .35 + .65 * (.5 + .5 * Math.sin(now * .001 * s.s + s.p));
      ctx.fillStyle = `rgba(255,244,235,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      if (s.r > 1.2){
        ctx.strokeStyle = `rgba(255,244,235,${a * .5})`; ctx.lineWidth = .6;
        ctx.beginPath(); ctx.moveTo(s.x - s.r*3.2, s.y); ctx.lineTo(s.x + s.r*3.2, s.y);
        ctx.moveTo(s.x, s.y - s.r*3.2); ctx.lineTo(s.x, s.y + s.r*3.2); ctx.stroke();
      }
    }

    drawMoon(now);

    // poussière d'or
    for (const d of dust){
      d.x += d.vx * dt + Math.sin(now * .0006 + d.p) * .15;
      d.y += d.vy * dt;
      if (d.y < -10){ d.y = H + 10; d.x = Math.random() * W; }
      const a = .25 + .35 * Math.sin(now * .002 + d.p);
      ctx.fillStyle = `rgba(243,217,164,${Math.max(0, a)})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
    }

    // cœurs en continu
    hearthAcc += dt * intensity;
    if (hearthAcc > .55){ hearthAcc = 0; spawnHeart(); }
    ctx.save();
    for (let i = hearts.length - 1; i >= 0; i--){
      const h = hearts[i];
      h.y += h.vy * dt;
      h.x += h.vx * dt + Math.sin(now * .0012 + h.ph) * h.sway * dt;
      const fade = Math.min(1, Math.max(0, h.y / (H * .3)));
      if (h.y < -40){ hearts.splice(i, 1); continue; }
      ctx.globalAlpha = h.a * fade;
      ctx.shadowColor = h.c; ctx.shadowBlur = 18;
      ctx.fillStyle = h.c;
      heartPath(ctx, h.x, h.y, h.s);
      ctx.fill();
    }
    ctx.restore();

    // étoiles filantes
    nextShoot -= dt * 1000;
    if (nextShoot < 0 && !reduce){ shoot(); nextShoot = 4500 + Math.random() * 5000; }
    for (let i = shooters.length - 1; i >= 0; i--){
      const s = shooters[i];
      s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const k = 1 - s.life / s.max;
      if (k <= 0){ shooters.splice(i, 1); continue; }
      const tx = s.x - s.vx * .12, ty = s.y - s.vy * .12;
      const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, `rgba(255,255,255,${k})`);
      g.addColorStop(1, 'rgba(255,170,200,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // quelques cœurs déjà présents
  for (let i = 0; i < 8; i++) spawnHeart(Math.random() * W, Math.random() * H);

  /* =====================================================
     MUSIQUE DOUCE (synthétisée, aucune ressource externe)
     ===================================================== */
  let actx, master, musicOn = true, musicTimer, musicStarted = false;
  const CHORDS = [
    [220.00, 261.63, 329.63],   // La mineur
    [174.61, 220.00, 261.63],   // Fa
    [261.63, 329.63, 392.00],   // Do
    [196.00, 246.94, 293.66]    // Sol
  ];
  function startMusic(){
    if (musicStarted) return;
    musicStarted = true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0;
    master.gain.linearRampToValueAtTime(.2, actx.currentTime + 4);

    const delay = actx.createDelay(1);
    delay.delayTime.value = .46;
    const fb = actx.createGain(); fb.gain.value = .38;
    const wet = actx.createGain(); wet.gain.value = .45;
    delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(actx.destination);
    master.connect(actx.destination);
    master.connect(delay);

    let i = 0;
    const playChord = () => {
      if (!actx) return;
      const t0 = actx.currentTime + .05;
      const ch = CHORDS[i % CHORDS.length]; i++;
      // nappe
      ch.forEach(f => {
        const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
        o.type = 'triangle'; o.frequency.value = f / (f > 250 ? 2 : 1);
        lp.type = 'lowpass'; lp.frequency.value = 700;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(.16, t0 + 1.4);
        g.gain.linearRampToValueAtTime(0, t0 + 4.6);
        o.connect(lp); lp.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + 4.8);
      });
      // arpège de boîte à musique
      const pat = [0, 1, 2, 1, 2, 1, 0, 1];
      pat.forEach((k, n) => {
        const t = t0 + n * .5;
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = ch[k] * 2;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.22, t + .012);
        g.gain.exponentialRampToValueAtTime(.0008, t + 1.3);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + 1.4);
      });
    };
    playChord();
    musicTimer = setInterval(playChord, 4000);
  }
  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', () => {
    if (!actx) return;
    musicOn = !musicOn;
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.linearRampToValueAtTime(musicOn ? .2 : 0, actx.currentTime + .6);
    muteBtn.textContent = musicOn ? '♪ musique' : '♪ coupée';
  });

  /* =====================================================
     SCÉNARIO (le « film »)
     ===================================================== */
  const stage = document.getElementById('stage');
  const replay = document.getElementById('replay');
  let timers = [];

  // t en secondes, d = durée affichée (0 = reste à l'écran)
  const SCRIPT = [
    { t: 2.5,  d: 4.2, cls: 'soft',   txt: 'Il est tard…',                          int: 1 },
    { t: 7.2,  d: 4.6, cls: 'soft',   txt: 'Le monde s’endort tout doucement,',     int: 1 },
    { t: 12.2, d: 5,   cls: 'soft',   txt: 'mais mon cœur veille encore, pour toi.', int: 1.6, burst: 10 },
    { t: 18.0, d: 4.6, cls: 'script', txt: 'Bonne nuit',                            int: 2,   burst: 18 },
    { t: 23.0, d: 3.4, cls: 'script sm', txt: 'mon cœur',                           int: 2.2, burst: 14 },
    { t: 26.8, d: 3.4, cls: 'script sm', txt: 'mon amour',                          int: 2.4, burst: 16 },
    { t: 30.6, d: 3.8, cls: 'script sm', txt: 'mon ange',                           int: 2.6, burst: 18 },
    { t: 35.0, d: 6,   cls: 'name pulse', txt: 'DIVINE',                            int: 4,   burst: 40, letters: true },
    { t: 41.6, d: 6,   cls: 'name pulse', txt: 'MON TOUT',                          int: 4,   burst: 40, letters: true },
    { t: 48.4, d: 4.6, cls: 'soft',   txt: 'Tu es ma dernière pensée ce soir,',     int: 1.4 },
    { t: 53.4, d: 4.4, cls: 'soft',   txt: 'et la première de mon réveil.',         int: 1.4, burst: 8 },
    { t: 58.4, d: 4.6, cls: 'soft',   txt: 'Ferme les yeux, mon amour…',            int: 1.2 },
    { t: 63.4, d: 5.2, cls: 'soft',   txt: 'Je serai dans chacun de tes rêves.',    int: 1.8, burst: 14 },
    { t: 69.6, d: 0,   cls: 'final',  txt: '',                                      int: 3,   burst: 50 }
  ];

  function makeLine(step){
    const el = document.createElement('div');
    if (step.cls === 'final'){
      el.className = 'line';
      el.innerHTML =
        '<div class="script">Bonne nuit,</div>' +
        '<div class="name pulse" style="margin-top:.2em;font-size:clamp(2rem,10vw,5.4rem)"><span class="w" style="animation-delay:.6s">DIVINE</span></div>' +
        '<span class="final-heart">💗</span>';
      return el;
    }
    el.className = 'line ' + step.cls;
    if (step.letters){
      [...step.txt].forEach((ch, i) => {
        const s = document.createElement('span');
        s.className = 'w';
        s.style.animationDelay = (i * .16) + 's';
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        el.appendChild(s);
      });
    } else {
      step.txt.split(' ').forEach((word, i) => {
        const s = document.createElement('span');
        s.className = 'w';
        s.style.animationDelay = (i * .28) + 's';
        s.textContent = word;
        el.appendChild(s);
      });
    }
    return el;
  }

  function later(fn, sec){ timers.push(setTimeout(fn, sec * 1000)); }

  function play(){
    stage.innerHTML = '';
    replay.classList.remove('show');
    intensity = 1;
    SCRIPT.forEach(step => {
      later(() => {
        const el = makeLine(step);
        stage.appendChild(el);
        intensity = step.int;
        if (step.burst) burst(step.burst);
        if (step.d > 0){
          later(() => {
            el.classList.add('out');
            setTimeout(() => el.remove(), 2600);
          }, step.d);
        } else {
          later(() => replay.classList.add('show'), 5);
        }
      }, step.t);
    });
  }

  replay.addEventListener('click', () => {
    timers.forEach(clearTimeout); timers = [];
    stage.querySelectorAll('.line').forEach(l => l.classList.add('out'));
    setTimeout(() => { stage.innerHTML = ''; play(); }, 1500);
  });

  document.getElementById('start').addEventListener('click', () => {
    document.getElementById('intro').classList.add('gone');
    document.body.classList.add('playing');
    startMusic();
    if (actx && actx.state === 'suspended') actx.resume();
    burst(14);
    play();
  });
})();
</script>
</body>
</html>
